<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <circle cx="256" cy="256" r="248" fill="#FFF3E0"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#FFB74D" stroke-width="16"/>

  <!-- Car window (large, the hero frame) -->
  <path d="M118 130
           C124 96 152 76 190 76
           L322 76
           C360 76 388 96 394 130
           L394 300
           L118 300 Z"
        fill="#B3E5FC" stroke="#0277BD" stroke-width="12" stroke-linejoin="round"/>

  <!-- Soft night sky inside window -->
  <path d="M124 132 C128 104 152 88 190 88 L322 88 C360 88 384 104 388 132 L388 294 L124 294 Z"
        fill="#CDEDFF"/>
  <circle cx="150" cy="130" r="8" fill="#FFF9C4"/>
  <circle cx="360" cy="150" r="6" fill="#FFF9C4"/>
  <circle cx="190" cy="105" r="5" fill="#FFF9C4"/>

  <!-- Baby head (big, centered) -->
  <circle cx="256" cy="200" r="86" fill="#FFE0BD" stroke="#E0A96D" stroke-width="8"/>
  <!-- Ears -->
  <circle cx="170" cy="205" r="14" fill="#FFE0BD" stroke="#E0A96D" stroke-width="6"/>
  <circle cx="342" cy="205" r="14" fill="#FFE0BD" stroke="#E0A96D" stroke-width="6"/>
  <!-- Hair curl on top -->
  <path d="M250 112 C248 96 272 94 270 114" fill="none" stroke="#8D6E63" stroke-width="10" stroke-linecap="round"/>
  <!-- Closed happy eyes -->
  <path d="M212 198 q11 12 22 0" fill="none" stroke="#5D4037" stroke-width="8" stroke-linecap="round"/>
  <path d="M278 198 q11 12 22 0" fill="none" stroke="#5D4037" stroke-width="8" stroke-linecap="round"/>
  <!-- Happy smile -->
  <path d="M232 236 q24 20 48 0" fill="none" stroke="#D98CA6" stroke-width="7" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="196" cy="224" r="11" fill="#F8BBD0"/>
  <circle cx="316" cy="224" r="11" fill="#F8BBD0"/>

  <!-- Baby body / blanket tucked in car seat -->
  <path d="M170 300
           C170 272 210 262 256 262
           C302 262 342 272 342 300 Z"
        fill="#FF8A80" stroke="#E57373" stroke-width="7" stroke-linejoin="round"/>
  <!-- Car-seat harness straps -->
  <path d="M214 268 L226 300" stroke="#FFD54F" stroke-width="10" stroke-linecap="round"/>
  <path d="M298 268 L286 300" stroke="#FFD54F" stroke-width="10" stroke-linecap="round"/>

  <!-- Zzz (small, top right of head) -->
  <g fill="none" stroke="#5C6BC0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M362 110 h22 l-22 17 h22"/>
    <path d="M392 82 h16 l-16 13 h16"/>
  </g>

  <!-- Car body (bottom frame, reduced) -->
  <path d="M96 300
           L416 300
           C436 300 444 312 444 326
           C444 340 436 348 416 348
           L124 348
           C104 348 96 340 96 326 Z"
        fill="#4FC3F7" stroke="#0277BD" stroke-width="10" stroke-linejoin="round"/>

  <!-- Headlight -->
  <circle cx="424" cy="326" r="13" fill="#FFF176" stroke="#F9A825" stroke-width="6"/>

  <!-- Wheels peeking at bottom -->
  <circle cx="156" cy="352" r="34" fill="#455A64" stroke="#263238" stroke-width="10"/>
  <circle cx="156" cy="352" r="12" fill="#ECEFF1"/>
  <circle cx="380" cy="352" r="34" fill="#455A64" stroke="#263238" stroke-width="10"/>
  <circle cx="380" cy="352" r="12" fill="#ECEFF1"/>

  <!-- Little hearts for friendly mood -->
  <path d="M108 168 c-7 -12 -26 -5 -19 7 l19 14 l19 -14 c7 -12 -12 -19 -19 -7 Z" fill="#F48FB1"/>
  <path d="M415 175 c-5 -8 -18 -3 -13 5 l13 9 l13 -9 c5 -8 -8 -13 -13 -5 Z" fill="#F8BBD0"/>
</svg>